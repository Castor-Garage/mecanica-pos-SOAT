name: CI/CD - Castor Garage API

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  IMAGE_NAME: ghcr.io/castor-garage/mecanica-pos-soat
  EKS_CLUSTER: castor-garage
  AWS_REGION: us-east-1

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workshop
          POSTGRES_PASSWORD: workshop
          POSTGRES_DB: mecanica_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workshop -d mecanica_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://workshop:workshop@localhost:5432/mecanica_test_db

  build:
    name: Build e publicar imagem Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'develop-latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy em produção (main)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configurar credenciais AWS (sessão temporária do Academy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apontar kubectl para o cluster EKS
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER}" --region "${AWS_REGION}" --alias "${EKS_CLUSTER}"

      - name: Aplicar manifesto de namespace
        run: kubectl apply -f k8s/api/overlays/production/namespace.yaml

      # castor-garage-secret so e aplicado manualmente nesse namespace (ver
      # README) - so a chave da New Relic e mantida em dia aqui, via patch
      # (nao mexe nas outras chaves ja existentes, como DATABASE_URL/JWT_SECRET).
      - name: Atualizar license key da New Relic no Secret (production)
        run: |
          kubectl --context "${EKS_CLUSTER}" -n castor-garage-production patch secret castor-garage-secret \
            --type merge -p "{\"stringData\":{\"NEW_RELIC_LICENSE_KEY\":\"${NEW_RELIC_LICENSE_KEY}\"}}"
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}

      - name: Patch da tag de imagem (production)
        run: |
          sed -i "s/newTag:.*/newTag: ${GITHUB_SHA}/" k8s/api/overlays/production/kustomization.yaml

      - name: Aplicar configuração via kustomize (production)
        run: kubectl apply -k k8s/api/overlays/production

      - name: Aguardar rollout (production)
        run: kubectl --context "${EKS_CLUSTER}" -n castor-garage-production rollout status deployment/castor-garage-api --timeout=180s

      - name: Descobrir hostname do LoadBalancer (production)
        id: lb
        run: |
          for i in $(seq 1 20); do
            HOST=$(kubectl --context "${EKS_CLUSTER}" -n castor-garage-production get svc castor-garage-api -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$HOST" ]; then
              echo "hostname=$HOST" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "aguardando o Load Balancer provisionar... ($i/20)"
            sleep 15
          done
          echo "Load Balancer nao ficou pronto a tempo" >&2
          exit 1

      - name: Smoke test (/health) - production
        run: |
          HOST="${{ steps.lb.outputs.hostname }}"
          for i in $(seq 1 15); do
            if curl -sf "http://${HOST}:3000/health"; then exit 0; fi
            echo "aguardando API responder... ($i/15)"
            sleep 10
          done
          echo "API nao respondeu a tempo" >&2
          exit 1

      - name: Status do HPA (production)
        run: kubectl --context "${EKS_CLUSTER}" -n castor-garage-production get hpa

      - name: Publicar backend URL no SSM Parameter Store (production)
        run: |
          aws ssm put-parameter \
            --name /castor-garage/production/backend-url \
            --type String \
            --overwrite \
            --value "${{ steps.lb.outputs.hostname }}"

  deploy-staging:
    name: Deploy em staging (develop)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configurar credenciais AWS (sessão temporária do Academy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apontar kubectl para o cluster EKS
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER}" --region "${AWS_REGION}" --alias "${EKS_CLUSTER}"

      - name: Aplicar manifesto de namespace (staging)
        run: kubectl apply -f k8s/api/overlays/staging/namespace.yaml

      # castor-garage-secret so e aplicado manualmente nesse namespace (ver
      # README) - so a chave da New Relic e mantida em dia aqui, via patch
      # (nao mexe nas outras chaves ja existentes, como DATABASE_URL/JWT_SECRET).
      - name: Atualizar license key da New Relic no Secret (staging)
        run: |
          kubectl --context "${EKS_CLUSTER}" -n castor-garage-staging patch secret castor-garage-secret \
            --type merge -p "{\"stringData\":{\"NEW_RELIC_LICENSE_KEY\":\"${NEW_RELIC_LICENSE_KEY}\"}}"
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}

      - name: Deletar Job anterior de bootstrap (evita template imutável)
        run: kubectl delete job create-staging-db -n castor-garage-staging --ignore-not-found

      - name: Aplicar Job de bootstrap do database (staging)
        run: kubectl apply -f k8s/jobs/create-staging-db.yaml

      - name: Aguardar conclusão do Job de bootstrap
        run: |
          kubectl wait --for=condition=complete job/create-staging-db \
            -n castor-garage-staging \
            --timeout=60s

      - name: Patch da tag de imagem (staging)
        run: |
          sed -i "s/newTag:.*/newTag: ${GITHUB_SHA}/" k8s/api/overlays/staging/kustomization.yaml

      - name: Aplicar configuração via kustomize (staging)
        run: kubectl apply -k k8s/api/overlays/staging

      - name: Aguardar rollout (staging)
        run: kubectl --context "${EKS_CLUSTER}" -n castor-garage-staging rollout status deployment/castor-garage-api --timeout=180s

      - name: Descobrir hostname do LoadBalancer (staging)
        id: lb
        run: |
          for i in $(seq 1 20); do
            HOST=$(kubectl --context "${EKS_CLUSTER}" -n castor-garage-staging get svc castor-garage-api -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$HOST" ]; then
              echo "hostname=$HOST" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "aguardando o Load Balancer provisionar... ($i/20)"
            sleep 15
          done
          echo "Load Balancer nao ficou pronto a tempo" >&2
          exit 1

      - name: Smoke test (/health) - staging
        run: |
          HOST="${{ steps.lb.outputs.hostname }}"
          for i in $(seq 1 15); do
            if curl -sf "http://${HOST}:3000/health"; then exit 0; fi
            echo "aguardando API responder... ($i/15)"
            sleep 10
          done
          echo "API nao respondeu a tempo" >&2
          exit 1

      - name: Status do HPA (staging)
        run: kubectl --context "${EKS_CLUSTER}" -n castor-garage-staging get hpa

      - name: Publicar backend URL no SSM Parameter Store (staging)
        run: |
          aws ssm put-parameter \
            --name /castor-garage/staging/backend-url \
            --type String \
            --overwrite \
            --value "${{ steps.lb.outputs.hostname }}"
