apiVersion: apps/v1
kind: Deployment
metadata:
  name: castor-garage-api
  namespace: castor-garage
  labels:
    app: castor-garage-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: castor-garage-api
  template:
    metadata:
      labels:
        app: castor-garage-api
    spec:
      containers:
        - name: api
          image: ghcr.io/castor-garage/mecanica-pos-soat:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: castor-garage-config
                  key: PORT
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: castor-garage-config
                  key: HOST
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: castor-garage-config
                  key: NODE_ENV
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: castor-garage-config
                  key: JWT_EXPIRES_IN
            - name: ADMIN_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: castor-garage-config
                  key: ADMIN_EMAIL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: castor-garage-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: castor-garage-secret
                  key: JWT_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: castor-garage-secret
                  key: ADMIN_PASSWORD
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: castor-garage-secret
                  key: WEBHOOK_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
