name: CI/CD - Castor Garage API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ghcr.io/castor-garage/mecanica-pos-soat
  EKS_CLUSTER: castor-garage
  AWS_REGION: us-east-1

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workshop
          POSTGRES_PASSWORD: workshop
          POSTGRES_DB: mecanica_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workshop -d mecanica_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://workshop:workshop@localhost:5432/mecanica_test_db

  build:
    name: Build e publicar imagem Docker
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no cluster EKS (AWS Academy)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # O cluster EKS ja existe — provisionado uma unica vez via
      # `infra/aws` (terraform apply), rodado manualmente antes da gravacao.
      # Este job so publica a nova imagem nele, nao cria/destroi infra.
      - name: Configurar credenciais AWS (sessao temporaria do Academy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apontar kubectl para o cluster EKS
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER}" --region "${AWS_REGION}" --alias "${EKS_CLUSTER}"

      - name: Aplicar manifestos da API (k8s/api)
        run: |
          sed "s#${IMAGE_NAME}:latest#${IMAGE_NAME}:${GITHUB_SHA}#" k8s/api/deployment.yaml > /tmp/api-deployment.yaml
          kubectl --context "${EKS_CLUSTER}" apply -f k8s/api/service.yaml
          kubectl --context "${EKS_CLUSTER}" apply -f k8s/api/hpa.yaml
          kubectl --context "${EKS_CLUSTER}" apply -f /tmp/api-deployment.yaml

      - name: Aguardar rollout
        run: kubectl --context "${EKS_CLUSTER}" -n castor-garage rollout status deployment/castor-garage-api --timeout=180s

      - name: Descobrir hostname do LoadBalancer
        id: lb
        run: |
          for i in $(seq 1 20); do
            HOST=$(kubectl --context "${EKS_CLUSTER}" -n castor-garage get svc castor-garage-api -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$HOST" ]; then
              echo "hostname=$HOST" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "aguardando o Load Balancer provisionar... ($i/20)"
            sleep 15
          done
          echo "Load Balancer nao ficou pronto a tempo" >&2
          exit 1

      - name: Smoke test (/health)
        run: |
          HOST="${{ steps.lb.outputs.hostname }}"
          for i in $(seq 1 15); do
            if curl -sf "http://${HOST}:3000/health"; then exit 0; fi
            echo "aguardando API responder... ($i/15)"
            sleep 10
          done
          echo "API nao respondeu a tempo" >&2
          exit 1

      - name: Status do HPA
        run: kubectl --context "${EKS_CLUSTER}" -n castor-garage get hpa
