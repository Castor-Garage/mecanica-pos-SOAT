name: Deploy Production (AWS EKS)

# Disparo manual: aba Actions -> Deploy Production (AWS EKS) -> Run workflow.
# Diferente de pipeline.yml (que roda kind automaticamente a cada push/PR),
# este workflow faz deploy no EKS/RDS reais e so roda quando explicitamente
# acionado, para nao falhar em pushes normais caso os secrets de AWS nao
# estejam configurados.
#
# Pre-requisito: a infra (infra/aws/) ja deve ter sido provisionada
# manualmente via `terraform apply` (ver infra/aws/README.md). Este workflow
# nao roda Terraform, so aplica os manifestos e atualiza a imagem no cluster
# ja existente.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag da imagem a fazer deploy (default: sha do commit atual)"
        required: false
        default: ""

env:
  IMAGE_NAME: ghcr.io/castor-garage/mecanica-pos-soat

jobs:
  build:
    name: Build e publicar imagem Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Definir tag da imagem
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA}"; fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no EKS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Atualizar kubeconfig para o EKS
        run: |
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Aplicar namespace
        run: kubectl apply -f k8s/aws/namespace.yaml

      - name: Aplicar manifestos da aplicacao
        run: |
          kubectl apply -f k8s/aws/configmap.yaml
          kubectl apply -f k8s/aws/secret.yaml
          kubectl apply -f k8s/aws/service.yaml
          kubectl apply -f k8s/aws/ingress.yaml
          kubectl apply -f k8s/aws/hpa.yaml
          kubectl apply -f k8s/aws/deployment.yaml

      - name: Atualizar imagem no deployment
        run: |
          kubectl set image deployment/mecanica-api \
            api="${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}" \
            --namespace mecanica

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/mecanica-api \
            --namespace mecanica \
            --timeout=120s
