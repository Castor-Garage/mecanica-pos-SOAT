name: CI/CD - Lambda Auth CPF

# So dispara quando algo em /lambda muda, para nao rodar (nem depender dos
# secrets abaixo) a cada push que mexe so na API principal.
on:
  push:
    branches: [ main ]
    paths: [ 'lambda/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'lambda/**' ]

env:
  AWS_REGION: us-east-1

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lambda/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  deploy:
    name: Build, package e deploy via Terraform
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: lambda

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lambda/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Empacotar a Lambda (function.zip)
        run: npm run package

      # Mesma sessao temporaria do AWS Academy usada no pipeline da API
      # principal (.github/workflows/pipeline.yml).
      - name: Configurar credenciais AWS (sessao temporaria do Academy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: lambda/infra
        run: terraform init

      # Secrets exclusivos deste workflow (alem dos AWS_* acima):
      # LAB_ROLE_ARN, DATABASE_URL (endpoint do RDS) e JWT_SECRET (o mesmo
      # valor configurado em k8s/secret.yaml, senao a API principal rejeita
      # o token emitido pela Lambda).
      - name: Terraform apply
        working-directory: lambda/infra
        env:
          TF_VAR_lab_role_arn: ${{ secrets.LAB_ROLE_ARN }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        run: terraform apply -auto-approve

      - name: Mostrar endpoint publicado
        working-directory: lambda/infra
        run: terraform output api_endpoint
