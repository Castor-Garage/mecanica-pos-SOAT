apiVersion: v1
kind: Secret
metadata:
  name: mecanica-api-secret
  namespace: mecanica
type: Opaque
data:
  # base64-encoded values — replace before applying
  # echo -n 'your-jwt-secret' | base64
  JWT_SECRET: CHANGE_ME_BASE64_JWT_SECRET
  # echo -n 'postgresql://user:pass@rds-endpoint:5432/mecanica_db' | base64
  DATABASE_URL: CHANGE_ME_BASE64_DATABASE_URL
