kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Expoe o NodePort da API (k8s/api/service.yaml) na porta 30080 do host,
      # sem precisar de `kubectl port-forward`.
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
